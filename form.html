<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        /* General Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #74ebd5 rgb(82, 83, 58)e6);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Form Container */
        .form-container {
            background-color: white;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        /* Heading */
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        /* Labels */
        label {
            display: inline-block;
            color: #333;
            font-weight: bold;
            margin-bottom: 8px;
        }

        /* Text Inputs */
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        /* Focus Effect */
        input:focus,
        select:focus,
        textarea:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 5px rgba(108, 99, 255, 0.4);
        }

        /* Radio Buttons and Checkbox */
        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 7px;
            accent-color: #6c63ff;
            cursor: pointer;
        }

        .gender-options {
            margin-bottom: 18px;
        }

        .gender-options label,
        .terms label {
            font-weight: normal;
            margin-right: 15px;
        }

        .terms {
            margin-bottom: 20px;
        }

        /* Buttons */
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }

        button[type="submit"] {
            background-color: #6c63ff;
            color: white;
            width: 65%;
        }

        button[type="reset"] {
            background-color: #e5e5e5;
            color: #333;
            width: 32%;
        }

        button[type="submit"]:hover {
            background-color: #5148d9;
        }

        button[type="reset"]:hover {
            background-color: #ccc;
        }

        /* Mobile Responsive Design */
        @media (max-width: 480px) {
            .form-container {
                padding: 20px;
            }

            h2 {
                font-size: 22px;
            }

            button {
                font-size: 13px;
                padding: 12px 8px;
            }
        }
    </style>
</head>

<body>

    <div class="form-container">

        <h2>Registration Form</h2>

        <form action="/submit" method="post">

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="fullname" placeholder="Enter your name" minlength="3" maxlength="50"
                required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" minlength="8"
                maxlength="20" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="03001234567" pattern="[0-9]{11}"
                title="Enter an 11-digit phone number" required>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="18" max="100" placeholder="Enter your age" required>

            <label>Gender:</label>

            <div class="gender-options">
                <input type="radio" id="male" name="gender" value="Male" required>
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="Female">
                <label for="female">Female</label>
            </div>

            <label for="country">Country:</label>
            <select id="country" name="country" required>
                <option value="">Select Country</option>
                <option value="Pakistan">Pakistan</option>
                <option value="India">India</option>
                <option value="Other">Other</option>
            </select>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" placeholder="Write your message" maxlength="200"></textarea>

            <div class="terms">
                <input type="checkbox" id="terms" name="terms" value="accepted" required>
                <label for="terms">
                    I accept the terms and conditions.
                </label>
            </div>

            <button type="submit">Submit</button>
            <button type="reset">Reset</button>

        </form>

    </div>

</body>

</html>
